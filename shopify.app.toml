# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "9391c1304754438b0060922be061ad04"
name = "Cyncly Chatbot"
application_url = "https://example.com"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2025-10"

[access_scopes]
# read_products is REQUIRED for Admin GraphQL product queries.
# After changing this, run: shopify app dev --reset
# (select "No" to keep existing app, select your dev store — you will be
# prompted to re-install the app which grants the new scope to the token)
scopes = "unauthenticated_read_product_listings,read_products,read_content,read_product_listings"

[auth]
redirect_urls = [ "https://example.com/api/auth" ]
